name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate HTML
        run: npx --yes htmlhint index.html 404.html
      - name: Check JSON files parse
        run: |
          python3 -c "import json; json.load(open('site.webmanifest'))"
      - name: Check service worker syntax
        run: node --check sw.js
