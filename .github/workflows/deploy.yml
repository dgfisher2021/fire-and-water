name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # @dust-ui/* installs from GitHub Packages, owned by the dust-ui
      # organization. The committed .npmrc carries the scope->registry
      # mapping; the runner supplies auth here, exactly like a developer's
      # user-level ~/.npmrc. Needs the repo secret DUST_UI_READ_TOKEN (a
      # classic PAT with read:packages): this repo sits outside the org, so
      # the workflow token cannot be granted access to the packages. The
      # fallback only matters if the repo is ever moved into the org.
      - name: Authenticate to GitHub Packages
        env:
          DUST_UI_READ_TOKEN: ${{ secrets.DUST_UI_READ_TOKEN || github.token }}
        run: echo "//npm.pkg.github.com/:_authToken=${DUST_UI_READ_TOKEN}" >> ~/.npmrc

      # Says why an install would fail without revealing the token: a classic
      # PAT is "ghp_", 40 characters, and lists read:packages in its scopes.
      - name: Check the package token
        env:
          DUST_UI_READ_TOKEN: ${{ secrets.DUST_UI_READ_TOKEN || github.token }}
        run: |
          echo "prefix ${DUST_UI_READ_TOKEN:0:4}, length ${#DUST_UI_READ_TOKEN}"
          curl -s -o /dev/null -D - -H "Authorization: token ${DUST_UI_READ_TOKEN}" https://api.github.com/user \
            | grep -i "^HTTP\|x-oauth-scopes" || true

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          VITE_BASE_PATH: /fire-and-water/
        run: pnpm build

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
