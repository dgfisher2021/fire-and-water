name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pnpm version comes from package.json's packageManager field.
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      # @dust-ui/* installs from GitHub Packages (private). The committed
      # .npmrc carries the scope->registry mapping; the runner supplies auth
      # here, exactly like a developer's user-level ~/.npmrc. Uses the repo
      # secret DUST_UI_READ_TOKEN (a classic PAT with read:packages) when
      # set, else the workflow token, which works once the @dust-ui packages
      # grant this repository access (package settings, "Manage Actions access").
      - name: Authenticate to GitHub Packages
        env:
          DUST_UI_READ_TOKEN: ${{ secrets.DUST_UI_READ_TOKEN || github.token }}
        run: echo "//npm.pkg.github.com/:_authToken=${DUST_UI_READ_TOKEN}" >> ~/.npmrc

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        env:
          VITE_BASE_PATH: /fire-and-water/
        run: pnpm build

      - name: SPA fallback for deep links
        run: cp dist/index.html dist/404.html

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
