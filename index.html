    <script>
      // First paint matches the persisted (or default dark) mode; the
      // appearance provider takes over after hydration.
      try {
        var s = JSON.parse(
          localStorage.getItem('fire-and-water-appearance') || '{}'
        )
        var m = s.themeMode || 'dark'
        var dark =
          m === 'dark' ||
          (m === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
      } catch (e) {
        document.documentElement.classList.add('dark')
      }
    </script>
    <script>
      ;(function () {
        // Legacy share links (#pencil / #fire / #water) open the lyrics route.
        var hash = window.location.hash.slice(1)
        if (/^(pencil|fire|water)$/.test(hash)) {
          var base = window.location.pathname.replace(/\/?$/, '/')
          window.history.replaceState(
            null,
            '',
            base + 'lyrics/' + hash + window.location.search
          )
        }
      })()
    </script>
