      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />

    <meta name="color-scheme" content="dark" />
    <title>Fire &amp; Water — Dustin &amp; Alex</title>
    <meta
      name="description"
      content="Three original songs exploring the bond between a brother and sister — Pencil and Pen, Fire and Water, and Water and Fire. Listen and read the lyrics side by side."
    />
    <meta name="author" content="Dustin Fisher" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Fire &amp; Water" />
    <link rel="canonical" href="https://dgfisher2021.github.io/fire-and-water/" />
    <meta property="og:type" content="music.album" />
    <meta property="og:title" content="Fire &amp; Water — Dustin &amp; Alex" />
    <meta
      property="og:description"
      content="Three original songs exploring the bond between a brother and sister. Listen and read the lyrics side by side."
    />
    <meta property="og:url" content="https://dgfisher2021.github.io/fire-and-water/" />
    <meta
      property="og:image"
      content="https://dgfisher2021.github.io/fire-and-water/assets/icon-512.png"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fire &amp; Water — Dustin &amp; Alex" />
    <meta
      name="twitter:description"
      content="Three original songs exploring the bond between a brother and sister."
    />
    <meta
      name="twitter:image"
      content="https://dgfisher2021.github.io/fire-and-water/assets/icon-512.png"
    />
    <link rel="icon" href="assets/favicon.png" type="image/png" />
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png" />
    <link rel="preload" as="image" href="assets/pencil.jpg" fetchpriority="high" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "MusicAlbum",
        "name": "Fire & Water",
        "byArtist": { "@type": "MusicGroup", "name": "Dustin & Alex" },
        "url": "https://dgfisher2021.github.io/fire-and-water/",
        "image": "https://dgfisher2021.github.io/fire-and-water/assets/icon-512.png",
        "numTracks": 3,
        "track": [
          {
            "@type": "MusicRecording",
            "name": "Pencil and Pen",
            "position": 1,
            "audio": "https://dgfisher2021.github.io/fire-and-water/pencil-and-pen.m4a"
          },
          {
            "@type": "MusicRecording",
            "name": "Fire and Water",
            "position": 2,
            "audio": "https://dgfisher2021.github.io/fire-and-water/fire-and-water.m4a"
          },
          {
            "@type": "MusicRecording",
            "name": "Water and Fire",
            "position": 3,
            "audio": "https://dgfisher2021.github.io/fire-and-water/water-and-fire.m4a"
          }
        ]
      }
    </script>
    <script>
      ;(function () {
        var l = window.location
        // SPA-on-GH-Pages restore: 404.html (a copy of this file) receives
        // deep links with the path encoded as `?/seg1/seg2`. Decode before
        // TanStack Router boots so it sees the real pathname.
        if (l.search && l.search.charAt(1) === '/') {
          var parts = l.search.slice(2).split('&')
          var path = parts.shift().replace(/~and~/g, '&')
          var query = parts.length
            ? '?' + parts.join('&').replace(/~and~/g, '&')
            : ''
          window.history.replaceState(
            null,
            '',
            l.pathname + path + query + l.hash
          )
        }
        // Legacy share links (#pencil / #fire / #water) open the lyrics route.
        var hash = window.location.hash.slice(1)
        if (/^(pencil|fire|water)$/.test(hash)) {
          var base = window.location.pathname.replace(/\/?$/, '/')
          window.history.replaceState(
            null,
            '',
            base + 'lyrics/' + hash + window.location.search
          )
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
